<app-drawer
  [open]="visibility()"
  [title]="drawerTitle()"
  (closed)="close()"
>
  <app-sidebar-content />
</app-drawer>

<aside
  class="sticky top-(--header-h) hidden h-[calc(100vh-var(--header-h))] w-72 shrink-0 border-r border-line bg-surface md:block"
  aria-label="Información del autor y navegación"
>
  <div class="h-full overflow-y-auto p-6">
    <app-sidebar-content />
  </div>
</aside>
