<div
  class="flex w-full sm:hidden justify-between shadow fixed backdrop-blur-md bg-[#1D232A]/80 z-10"
>
  <button
    (click)="doVisible()"
    class="py-3 px-6 color-white cursor-pointer bg-transparent border-none"
  >
    <svg xmlns="http://www.w3.org/2000/svg" height="20" width="17.5" viewBox="0 0 448 512">
      <path
        fill="#fff"
        d="M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z"
      />
    </svg>
  </button>
  <div class="py-3 px-6 w-full text-center">Elias Marcos 🧑‍💻</div>
  <div class="py-3 px-6">
    <button
      (click)="toggleLanguage(iconLanguage().code)"
      class="bg-transparent border-none cursor-pointer"
    >
      <img
        class="w-8"
        [src]="iconLanguage().url"
        [alt]="iconLanguage().alt"
        [title]="iconLanguage().tooltip"
      />
    </button>
  </div>
</div>

<div class="relative text-end hidden sm:block z-50">
  <div class="fixed top-4 right-4 hidden sm:inline-block">
    <button
      (click)="toggleLanguage(iconLanguage().code)"
      class="bg-transparent border-none cursor-pointer"
    >
      <img
        class="w-8"
        [src]="iconLanguage().url"
        [alt]="iconLanguage().alt"
        [title]="iconLanguage().tooltip"
      />
    </button>
  </div>
</div>
