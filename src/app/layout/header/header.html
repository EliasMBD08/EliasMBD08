<header
  class="sticky top-0 z-40 flex h-(--header-h) w-full items-center justify-between border-b border-line bg-canvas/85 px-5 backdrop-blur-md md:px-8"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-md text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand md:hidden"
      [attr.aria-label]="t().nav.home + ' — abrir menú'"
      [attr.aria-expanded]="sidebar.visibility()"
      aria-controls="primary-nav"
      (click)="openDrawer()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <a
      href="#inicio"
      class="group inline-flex items-baseline gap-2 text-base font-semibold tracking-tight text-ink transition-colors hover:text-brand"
    >
      <span
        class="font-mono text-sm text-brand transition-transform group-hover:translate-x-0.5"
        >&lt;</span
      >
      <span>{{ t().home.name }}</span>
      <span class="font-mono text-sm text-brand">/&gt;</span>
    </a>
  </div>

  <nav
    class="hidden items-center gap-1 md:flex"
    aria-label="Navegación principal"
  >
    <a
      href="#inicio"
      class="rounded-md px-3 py-2 text-sm font-medium text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
      >{{ t().nav.home }}</a
    >
    <a
      href="#proyectos"
      class="rounded-md px-3 py-2 text-sm font-medium text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
      >{{ t().nav.projects }}</a
    >
    <a
      href="#curriculum"
      class="rounded-md px-3 py-2 text-sm font-medium text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
      >{{ t().nav.curriculum }}</a
    >
    <a
      href="#contacto"
      class="rounded-md px-3 py-2 text-sm font-medium text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
      >{{ t().nav.contact }}</a
    >
  </nav>

  <div class="flex items-center gap-1">
    <button
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-md text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
      [attr.aria-label]="t().actions.toggleTheme"
      (click)="toggleTheme()"
    >
      @if (theme.theme() === 'dark') {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </button>

    <button
      type="button"
      class="inline-flex h-10 items-center gap-1.5 rounded-md px-2.5 text-sm font-medium text-ink-muted transition-colors hover:bg-surface-2 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
      [attr.aria-label]="t().actions.changeLanguage + ': ' + nextLangLabel()"
      (click)="toggleLang()"
    >
      <span class="font-mono text-xs">{{ i18n.lang() === 'es' ? 'EN' : 'ES' }}</span>
    </button>
  </div>
</header>
