<a

  [href]="'#' + item().linkto"
>
  <span
    aria-hidden="true"
    class="h-1.5 w-1.5 rounded-full bg-brand opacity-0 transition-opacity group-hover:opacity-100"
  ></span>
  <span>{{ item().title }}</span>
</a>
