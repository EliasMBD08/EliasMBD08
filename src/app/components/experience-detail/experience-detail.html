<div class="relative flex gap-5 pb-6">
  <div class="flex flex-col items-center pt-1.5">
    <span
      class="relative z-10 inline-flex h-3 w-3 rounded-full bg-brand ring-4 ring-canvas"
      aria-hidden="true"
    ></span>
    @if (lineVisible()) {
      <span
        class="mt-0 h-full w-px flex-1 bg-gradient-to-b from-brand/60 to-transparent"
        aria-hidden="true"
      ></span>
    }
  </div>

  <div class="flex-1 pt-0.5">
    <h3 class="text-base font-semibold leading-snug text-ink">
      {{ experience().role }}
    </h3>
    <div class="mt-1 flex flex-wrap items-center gap-x-2 text-xs text-ink-subtle">
      <span>{{ experience().company }}</span>
      @if (experience().duration) {
        <span aria-hidden="true">·</span>
        <span class="font-mono">{{ experience().duration }}</span>
      }
    </div>
    @if (experience().desc) {
      <p class="mt-2 text-sm leading-relaxed text-ink-muted">
        {{ experience().desc }}
      </p>
    }
  </div>
</div>
