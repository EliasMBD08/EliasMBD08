<article
  class="group relative flex flex-col overflow-hidden rounded-xl border border-line bg-[var(--gradient-card)] from-surface to-surface/50 transition-all duration-300 hover:-translate-y-0.5 hover:border-line-strong hover:shadow-elev"
>
  <a
    [href]="project().link"
    target="_blank"
    rel="noopener noreferrer"
    class="absolute inset-0 z-10"
    [attr.aria-label]="project().title"
  >
    <span class="sr-only">Ver {{ project().title }}</span>
  </a>

  <div class="relative aspect-video w-full overflow-hidden bg-surface-2">
    <img
      [src]="project().image"
      [alt]="'Captura de ' + project().title"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
      loading="lazy"
      decoding="async"
    />
    <div
      class="absolute inset-0 bg-gradient-to-t from-canvas/60 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
      aria-hidden="true"
    ></div>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <header class="flex items-start justify-between gap-3">
      <h3
        class="text-lg font-semibold leading-tight text-ink transition-colors group-hover:text-brand"
      >
        {{ project().title }}
      </h3>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="mt-1 shrink-0 text-ink-muted transition-all group-hover:translate-x-0.5 group-hover:text-brand"
        aria-hidden="true"
      >
        <path d="M7 17 17 7"></path>
        <path d="M7 7h10v10"></path>
      </svg>
    </header>

    <p class="text-sm leading-relaxed text-ink-muted">
      {{ project().desc }}
    </p>

    @if (project().tags?.length) {
      <div class="mt-auto flex flex-wrap gap-1.5 pt-2">
        @for (tag of project().tags; track tag) {
          <app-tag>{{ tag }}</app-tag>
        }
      </div>
    }
  </div>
</article>
