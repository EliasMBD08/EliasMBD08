name: Build, Publish & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Un solo deploy a la vez por rama. No se cancela el que ya está en curso:
# si el build falla, el webhook no se dispara y Coolify conserva la versión anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Nombre explícito: el paquete NO se llama como el repo, sino como el proyecto
          images: ${{ env.REGISTRY }}/eliasmbd08/portafolio-elias
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # El deploy se dispara SOLO cuando la imagen ya está en GHCR.
      # Así Coolify nunca hace `docker compose pull` antes de tiempo (manifest unknown).
      # Secret: COOLIFY_DEPLOY_WEBHOOK -> Deploy Webhook del recurso en Coolify.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST "$COOLIFY_DEPLOY_WEBHOOK" -H "Accept: application/json"
