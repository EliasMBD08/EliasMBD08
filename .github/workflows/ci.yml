name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un solo deploy a la vez por rama. En PR se cancela el anterior (el push ya no
# es relevante); en main NO se cancela: si el build falla, el webhook no se
# dispara y Coolify conserva la version anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Lint ---
      - name: Lint
        run: npm run format:check

      # --- Typecheck ---
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      # --- Integration / build ---
      # Los budgets de angular.json (maximumWarning / maximumError) hacen fallar
      # el build si el bundle crece: es el gate de calidad, sin job aparte.
      - name: Production build
        run: npm run build

      # --- Security ---
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: 'Security scan (Trivy: vulns + secrets + misconfig)'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # --- Unit tests ---
      # Descomenta cuando existan archivos *.spec.ts. Sin tests, `ng test` sale
      # con codigo 1 ("No tests found") y dejaria el gate en rojo siempre.
      #
      # - name: Unit tests
      #   run: npx ng test --watch=false --coverage
      #
      # - name: Upload coverage
      #   if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: coverage-${{ github.sha }}
      #     path: ./coverage
      #     if-no-files-found: ignore

  docker-build:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Construye la imagen SIN publicarla: detecta un Dockerfile roto antes de
      # que Coolify falle en produccion. En este flujo nadie publica la imagen;
      # la construye Coolify en el VPS.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: portafolio-elias:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    # Solo en push a main: en PR no se despliega.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality-gate, docker-build]
    steps:
      # Secret: COOLIFY_DEPLOY_WEBHOOK -> Deploy Webhook URL del recurso.
      # Secret: COOLIFY_TOKEN         -> API token de Coolify (permiso deploy).
      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --request POST "$COOLIFY_DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Accept: application/json"
