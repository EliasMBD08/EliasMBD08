services:
  portafolio-elias:
    image: ghcr.io/eliasmbd08/portafolio-elias:latest
    pull_policy: always
    restart: always

    # Puerto interno del contenedor (lo usa Coolify para enrutar el dominio)
    expose:
      - "4000"

    # Healthcheck opcional: descomenta cuando tengas el endpoint de salud
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
