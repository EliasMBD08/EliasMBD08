# Despliegue en Coolify (Docker Compose) — build local en el VPS, sin registry.
#
# Contrato con Coolify:
#   - `build:` (no `image:`)  -> Coolify construye la imagen en el VPS
#   - SIN `container_name`      -> Coolify gestiona el nombre del contenedor
#   - SIN `networks: external`  -> Coolify crea la red y conecta el recurso
#   - SIN `labels: traefik.*`   -> los genera Coolify ("Managed by Coolify"),
#                                  con los entrypoints `http`/`https` de Traefik v3
#   - SIN `pull_policy`         -> no hay registry; `docker compose build --pull`
#                                  reconstruye siempre los servicios con `build:`
#   - Dominio y puerto se configuran en la UI:
#     Domains -> elias.bitnovastudios.com -> Port 4000
#
# La app no necesita variables de entorno: no hay `env_file` (evita el fallo
# "env file .env not found" cuando Coolify no genera el .env).
services:
  portafolio-elias:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: '4000'

    # Puerto interno del contenedor (lo usa Coolify para enrutar el dominio).
    # Debe coincidir con el "Port" configurado en Domains.
    expose:
      - '4000'

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
